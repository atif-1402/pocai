[package]
name = "pocai"
version = "1.3.0"
edition = "2021"
description = "Pocai — AI in your terminal"
license = "MIT"

[[bin]]
name = "pocai"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rustyline = "14"
terminal_size = "0.4"
regex = "1"
walkdir = "2"
dirs = "5"

# Markdown rendering
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }
unicode-width = "0.2"
unicode-segmentation = "1"
syntect = { version = "5.2", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
] }
unicodeit = "0.2"

[dev-dependencies]
tempfile = "3"
